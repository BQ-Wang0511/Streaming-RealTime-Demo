function displayLoop() {
  if (!audioStarted) {
    const estimatedTotal = totalExpectedFrames || playbackBufferFrames;
    const requiredFrames = streamDone
      ? Math.max(1, Math.min(playbackBufferFrames, state.frameCount))
      : Math.max(1, Math.min(playbackBufferFrames, estimatedTotal));
    const bufferedFrames = Math.min(requiredFrames, state.frameCount);
    if (bufferedFrames >= requiredFrames) {
      if (streamHasAudio) {
        audioPlayer.src = state.audioUrl;
        audioPlayer.currentTime = 0;
        networkRebuffering = false;
        audioPlayer.play().catch(() => {});
      } else if (streamUsesConversationTts) {
        networkRebuffering = false;
        startConversationTtsPlayback();
      } else {
        idleClockStartedAt = performance.now();
        idleClockStartFrame = 0;
      }
      audioStarted = true;
      if (streamUsesMicrophone) {
        startLiveMicrophonePlayback();
      }
      placeholder.style.display = 'none'; frameImg.style.display = 'block';
      liveBadge.style.display = 'inline'; fpsBadge.style.display = 'inline';
      statusText.textContent = streamUsesMicrophone
        ? 'Microphone live'
        : (
          streamUsesConversationTts
            ? 'Playing streamed speech'
            : (streamHasAudio ? 'Playing' : 'Idle motion')
        );
      document.getElementById('display').classList.add('active','streaming');
      const firstFrame = frameBuffer.get(0);
      if (firstFrame) {
        showBufferedFrame(0);
      }
    } else {
      statusText.textContent = `Buffering... ${bufferedFrames}/${requiredFrames}`;
    }
    displayRaf = requestAnimationFrame(displayLoop); return;
  }
  let target;
  const followingAudioClock = (
    streamHasAudio && !(continuousIdle && audioPlayer.ended)
  ) || streamUsesConversationTts;
  if (!followingAudioClock) {
    if (idleClockStartedAt === null) {
      idleClockStartedAt = performance.now();
      idleClockStartFrame = streamHasAudio
        ? Math.max(showFrameIdx, totalExpectedFrames)
        : showFrameIdx;
      statusText.textContent = streamUsesMicrophone
        ? 'Microphone live'
        : (continuousIdle ? 'Idle motion' : 'Playing video');
    }
    target = idleClockStartFrame + Math.floor(
      (performance.now() - idleClockStartedAt) / 1000 * streamTimelineFps,
    );
    target = Math.min(target, Math.max(0, state.frameCount - 1));
    reportPlayhead(target);
  } else {
    const playbackTime = streamUsesConversationTts
      ? conversationTtsPlayheadSeconds()
      : audioPlayer.currentTime;
    target = Math.floor(playbackTime * streamTimelineFps);
    if (totalExpectedFrames > 0) {
      target = Math.min(target, totalExpectedFrames - 1);
    }
    reportPlayhead(target);
    const resumeFrames = rebufferTargetFrames(target);
    const latestFrame = state.frameCount - 1;
    const readyFrames = Math.max(0, latestFrame - target + 1);
    if (latestFrame < target) {
      const now = performance.now();
      if (missingVideoFrameSince === null) missingVideoFrameSince = now;
      if (
        !networkRebuffering
        && now - missingVideoFrameSince < NETWORK_STALL_GRACE_MS
      ) {
        displayRaf = requestAnimationFrame(displayLoop);
        return;
      }
      if (streamUsesConversationTts) {
        pauseConversationTtsForBuffering();
      } else if (!audioPlayer.paused) {
        audioPlayer.pause();
      }
      networkRebuffering = true;
      statusText.textContent = (
        `Frame buffering... ${readyFrames}/${resumeFrames}`
      );
      displayRaf = requestAnimationFrame(displayLoop);
      return;
    }
    missingVideoFrameSince = null;
    if (networkRebuffering) {
      const bufferedFrame = bufferedFrameAtOrBefore(target);
      if (bufferedFrame !== null) showBufferedFrame(bufferedFrame);
      if (readyFrames < resumeFrames) {
        statusText.textContent = (
          `Frame buffering... ${readyFrames}/${resumeFrames}`
        );
        displayRaf = requestAnimationFrame(displayLoop);
        return;
      }
      networkRebuffering = false;
      statusText.textContent = 'Playing';
      if (streamUsesConversationTts) {
        resumeConversationTtsAfterBuffering();
      } else {
        audioPlayer.play().catch(() => {
          networkRebuffering = true;
        });
      }
    }
  }
  if (
    continuousIdle
    && (!streamHasAudio || audioPlayer.ended)
    && !frameBuffer.has(target)
    && frameBuffer.size
  ) {
    const oldestAvailable = frameBuffer.keys().next().value;
    if (oldestAvailable > target) {
      target = oldestAvailable;
      idleClockStartFrame = oldestAvailable;
      idleClockStartedAt = performance.now();
    }
  }
  if (target > showFrameIdx) {
    const bufferedFrame = bufferedFrameAtOrBefore(target);
    if (bufferedFrame !== null) showBufferedFrame(bufferedFrame);
  }
  const retainedHistoryFrames = Math.round(2.4 * streamTimelineFps);
  if (showFrameIdx > retainedHistoryFrames) {
    const oldestFrame = showFrameIdx - retainedHistoryFrames;
    for (const frameIndex of frameBuffer.keys()) {
      if (frameIndex < oldestFrame) frameBuffer.delete(frameIndex);
    }
  }

  // All frames rendered but audio still playing — hold last frame
  if (showFrameIdx >= state.frameCount - 1 && state.frameCount > 0) {
    if (
      !continuousIdle
      && (
        (streamHasAudio && audioPlayer.ended)
        || (
          streamUsesConversationTts
          && streamDone
          && conversationTtsPlaybackEnded()
        )
        || (
          !streamHasAudio
          && !streamUsesConversationTts
          && streamDone
        )
      )
    ) { finalCleanup(); return; }
    // Keep showing last frame, just continue loop
    displayRaf = requestAnimationFrame(displayLoop);
    return;
  }

  if (!continuousIdle && streamHasAudio && audioPlayer.ended) {
    finalCleanup(); return;
  }
  if (
    !continuousIdle
    && streamUsesConversationTts
    && streamDone
    && conversationTtsPlaybackEnded()
  ) {
    finalCleanup(); return;
  }
  displayRaf = requestAnimationFrame(displayLoop);
}

function closeStreamSocket(socket = state.ws, sendStop = false) {
  if (!socket) return;
  if (state.ws === socket) state.ws = null;
  socket.onopen = null;
  socket.onmessage = null;
  socket.onerror = null;
  socket.onclose = null;
  if (sendStop && socket.readyState === WebSocket.OPEN) {
    try {
      socket.send(JSON.stringify({ action: 'stop' }));
    } catch (error) {
      console.debug('Unable to stop the previous stream', error);
    }
  }
  if (
    socket.readyState === WebSocket.CONNECTING
    || socket.readyState === WebSocket.OPEN
  ) {
    socket.close();
  }
}

async function startFlowStream(options = {}) {
  const activeSrc = state.sources.find(s => s.id === state.activeSourceId);
  const videoDubbing = state.mode === 'video';
  const conversationStreamId = (
    typeof options?.conversationStreamId === 'string'
      ? options.conversationStreamId
      : ''
  );
  const conversationAudioMode = (
    state.mode === 'conversation' && !!conversationStreamId
  );
  const microphoneMode = (
    state.mode === 'audio' && state.microphoneSelected
  );
  const liveAudioMode = microphoneMode || conversationAudioMode;
  const motionBufferFrames = Math.max(
    1,
    Math.round(+$('streamFrames').value || 50),
  );
  const requestedPreviewFps = Math.max(
    1,
    Math.min(50, Math.round(+$('previewFps').value || 25)),
  );
  $('previewFps').value = requestedPreviewFps;
  $('streamFrames').value = motionBufferFrames;
  const continuousRequested = (videoDubbing || liveAudioMode)
    ? false
    : $('continuousIdle').checked;
  if (!activeSrc?.path || !activeSrc?.avatarId || !activeSrc.registered) {
    statusText.textContent = activeSrc?.path
      ? 'Register the active avatar before starting'
      : 'Choose an uploaded avatar';
    return;
  }
  if (sourceNeedsNeutralization(activeSrc) && !activeSrc.neutralized) {
    statusText.textContent = 'Run Neutralize for the active avatar first';
    return;
  }
  if (videoDubbing && !isVideoSource(activeSrc)) {
    statusText.textContent = 'Video dubbing requires a registered video source';
    return;
  }
  if (state.mode === 'audio' && isVideoSource(activeSrc)) {
    statusText.textContent = 'Use Video dubbing mode for a video source';
    return;
  }
  if (
    !state.audioPath
    && !liveAudioMode
    && !continuousRequested
    && !videoDubbing
  ) {
    statusText.textContent = (
      'Upload audio, choose Live microphone, or enable Continuous idle'
    );
    return;
  }
  if (microphoneMode) {
    state.microphoneFinishing = false;
    startBtn.disabled = true;
    statusText.textContent = 'Requesting microphone access...';
    try {
      await prepareLiveMicrophone();
    } catch (error) {
      statusText.textContent = `Microphone error: ${error.message}`;
      updateStartButton();
      return;
    }
  }
  const replacingReusableStream = currentStreamCanBeReplaced();
  closeStreamSocket(state.ws, true);
  if (displayRaf) {
    cancelAnimationFrame(displayRaf);
    displayRaf = null;
  }
  const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}/ws`);
  ws.binaryType = 'arraybuffer';
  state.ws = ws; state.streaming = true; state.frameCount = 0; state.fpsTimer = performance.now();
  state.activeSourceName = activeSrc.name;
  const basePlaybackBufferFrames = microphoneMode
    ? 1
    : (
      conversationAudioMode
        ? Math.max(1, Math.min(10, motionBufferFrames))
        : Math.max(
          1,
          Math.min(
            motionBufferFrames,
            Math.round(+$('playbackBufferFrames').value || 75),
          ),
        )
    );
  playbackBufferFrames = liveAudioMode && microphoneMode
    ? 1
    : Math.max(
      1,
      Math.round(
        basePlaybackBufferFrames * requestedPreviewFps / MOTION_FPS,
      ),
    );
  if (!liveAudioMode) {
    $('playbackBufferFrames').value = basePlaybackBufferFrames;
  }
  frameBuffer = new Map();
  receivedFrameCount = 0;
  streamTimelineFps = requestedPreviewFps;
  streamRenderFps = requestedPreviewFps;
  totalExpectedFrames = 0;
  streamDone = false;
  audioStarted = false;
  showFrameIdx = -1;
  continuousIdle = continuousRequested;
  streamHasAudio = !liveAudioMode && !!state.audioPath;
  streamUsesMicrophone = microphoneMode;
  streamUsesConversationTts = conversationAudioMode;
  idleClockStartedAt = null;
  idleClockStartFrame = 0;
  networkRebuffering = false;
  missingVideoFrameSince = null;
  lastReportedPlayhead = -1;
  startBtn.disabled = true; stopBtn.disabled = false;
  fpsBadge.style.display = 'inline';
  if (!replacingReusableStream) {
    placeholder.style.display = 'block';
    frameImg.style.display = 'none';
  }
  updateBadges(); updateStartButton();
  displayRaf = requestAnimationFrame(displayLoop);
  const registeredAvatarIds = state.sources
    .filter(source => (
      source.registered
      && (!sourceNeedsNeutralization(source) || source.neutralized)
      && source.avatarId
      && isVideoSource(source) === isVideoSource(activeSrc)
    ))
    .map(source => source.avatarId);
  ws.onopen = () => {
    if (state.ws !== ws) return;
    statusText.textContent = 'Connected';
    ws.send(JSON.stringify({
      source: activeSrc.path,
      avatar_id: activeSrc.avatarId,
      registered_avatar_ids: registeredAvatarIds,
      audio: liveAudioMode ? null : state.audioPath,
      microphone: microphoneMode,
      conversation_stream_id: conversationStreamId || null,
      lip_person_id: +$('lipPersonId').value,
      lip_guidance_weight: +$('lipGuidance').value,
      ...(videoDubbing ? {} : {
        pose_person_id: +$('posePersonId').value,
        pose_guidance_weight: +$('poseGuidance').value,
      }),
      sampling_steps: +$('samplingSteps').value,
      stream_frames: motionBufferFrames,
      render_fps: requestedPreviewFps,
      audio_chunk_seconds: +$('audioChunkSeconds').value,
      stage0: $('stage0').checked,
      neutral: $('neutral').checked,
      per_frame_normalize_delta: (
        videoDubbing
        && $('stage0').checked
        && !$('neutral').checked
        && $('perFrameNormalizeDelta').checked
      ),
      ditto_pose: videoDubbing
        ? false
        : $('dittoPose').checked,
      paste_back: $('pasteBack').checked,
      video_dubbing: videoDubbing,
      continuous_idle: continuousRequested,
    }));
  };
  let _pf = -1;
  let socketDone = false;
  ws.onmessage = (event) => {
    if (state.ws !== ws) return;
    if (typeof event.data === 'string') {
      const msg = JSON.parse(event.data);
      if (msg.t === 'f') { _pf = msg.i; return; }
      if (msg.type === 'ready') {
        state.modelsLoaded = true;
        state.fpsTimer = performance.now();
        receivedFrameCount = 0;
        totalExpectedFrames = msg.total_frames || 0;
        streamTimelineFps = +(msg.fps || requestedPreviewFps);
        streamRenderFps = +(
          msg.render_fps
          || streamTimelineFps
        );
        if (msg.motion_buffer_frames > 0) {
          playbackBufferFrames = Math.min(
            playbackBufferFrames,
            Math.round(msg.motion_buffer_frames),
          );
        }
        reportPlayhead(0, true);
        continuousIdle = !!msg.continuous_idle;
        streamHasAudio = !!msg.audio_url && totalExpectedFrames > 0;
        if (microphoneMode) {
          activateLiveMicrophone(ws);
        }
        statusText.textContent = microphoneMode
          ? 'Microphone live · speak now'
          : (
            conversationAudioMode
              ? `Waiting for streamed speech · 0/${playbackBufferFrames}`
              : `Buffering... 0/${Math.min(playbackBufferFrames, totalExpectedFrames || playbackBufferFrames)}`
          );
        if (streamHasAudio && state.audioUrl) {
          audioPlayer.src = state.audioUrl;
          audioPlayer.load();
        } else {
          audioPlayer.pause();
          audioPlayer.removeAttribute('src');
          audioPlayer.load();
        }
        updateStartButton();
      } else if (msg.type === 'done') {
        socketDone = true;
        streamDone = true;
        totalExpectedFrames = msg.total_frames || state.frameCount;
        if (microphoneMode && state.frameCount === 0) {
          finalCleanup();
          return;
        }
        statusText.textContent = audioStarted
          ? `Playing · generation complete (${state.frameCount} frames)`
          : `Generation complete · preparing playback (${state.frameCount} frames)`;
        updateStartButton();
        updateFps();
      } else if (msg.type === 'error') {
        if (
          msg.msg?.startsWith('Prepare this video again')
          || msg.msg?.startsWith('Register this video again')
          || msg.msg?.startsWith('Register this avatar again')
        ) {
          activeSrc.registered = false;
          activeSrc.registrationState = 'idle';
          activeSrc.registrationProgress = 0;
          activeSrc.registrationMessage = msg.msg;
          renderSources();
          saveState();
        }
        statusText.textContent = `Error: ${msg.msg}`;
        cleanup();
      }
      else if (msg.type === 'status') { statusText.textContent = msg.msg; }
      return;
    }
    const binary = event.data instanceof ArrayBuffer
      ? new Uint8Array(event.data)
      : null;
    if (
      binary
      && binary.length >= 4
      && binary[0] === 0x50
      && binary[1] === 0x43
      && binary[2] === 0x4d
      && binary[3] === 0x31
    ) {
      enqueueConversationTtsPcm(binary.subarray(4));
      return;
    }
    const blob = new Blob([event.data], { type: 'image/jpeg' });
    const idx = _pf >= 0 ? _pf : state.frameCount;
    if (!frameBuffer.has(idx)) receivedFrameCount += 1;
    frameBuffer.set(idx, blob);
    state.frameCount = Math.max(state.frameCount, idx + 1);
    _pf = -1;
    if (continuousIdle && (!streamHasAudio || audioPlayer.ended)) {
      const maxBufferedFrames = Math.max(
        playbackBufferFrames + Math.round(4.8 * streamTimelineFps),
        Math.round(9.6 * streamTimelineFps),
      );
      while (frameBuffer.size > maxBufferedFrames) {
        const oldestFrame = frameBuffer.keys().next().value;
        frameBuffer.delete(oldestFrame);
      }
    }
    if (receivedFrameCount % 15 === 0) updateFps();
  };
  ws.onerror = () => {
    if (state.ws !== ws) return;
    if (!socketDone) { statusText.textContent = 'WebSocket error'; cleanup(); }
  };
  ws.onclose = () => {
    if (state.ws !== ws) return;
    state.ws = null;
    if (!socketDone) { statusText.textContent = 'Disconnected'; cleanup(); }
  };
}
startBtn.addEventListener('click', startFlowStream);

function sendAudioToChunk(audioId) {
  const audio = state.audioFiles.find(item => item.id === audioId);
  const activeSrc = state.sources.find(item => item.id === state.activeSourceId);
  if (!['audio', 'video'].includes(state.mode) || !audio?.path) return;
  if (
    (state.mode === 'audio' && activeSrc?.isVideo)
    || (state.mode === 'video' && !activeSrc?.isVideo)
  ) {
    statusText.textContent = state.mode === 'video'
      ? 'Choose a registered video source'
      : 'Use Video dubbing mode for a video source';
    return;
  }
  if (!activeSrc?.path || !activeSrc?.avatarId || !activeSrc.registered) {
    statusText.textContent = activeSrc?.path
      ? 'Register the active avatar before sending audio'
      : 'Choose an uploaded avatar';
    return;
  }
  if (state.streaming && !audioStreamIsReusable()) {
    statusText.textContent = 'The current chunk is still generating';
    return;
  }
  state.microphoneSelected = false;
  state.activeAudioId = audio.id;
  state.audioPath = audio.path;
  state.audioUrl = audio.url;
  renderAudio();
  updateMotionControlState();
  saveState();
  statusText.textContent = `Sending ${audio.name} to motion chunk...`;
  startFlowStream();
}

function appendChatMessage(role, text = '') {
  chatEmpty.hidden = true;
  const message = document.createElement('div');
  message.className = `chat-message ${role}`;
  message.textContent = text;
  chatMessages.appendChild(message);
  chatMessages.scrollTop = chatMessages.scrollHeight;
  return message;
}

function installConversationAudio(event) {
  const id = `conversation_audio_${crypto.randomUUID
    ? crypto.randomUUID()
    : Date.now()}`;
  state.audioFiles.push({
    id,
    name: event.name || 'response.wav',
    path: event.path,
    url: event.url,
    file: null,
    error: false,
  });
  state.activeAudioId = id;
  state.audioPath = event.path;
  state.audioUrl = event.url;
  audioPlayer.src = event.url;
  audioPlayer.load();
  renderAudio();
}

async function sendConversationMessage(explicitText = null) {
  const text = (explicitText ?? chatInput.value).trim();
  const activeSrc = state.sources.find(s => s.id === state.activeSourceId);
  if (
    !text
    || !activeSrc?.path
    || !activeSrc?.avatarId
    || !activeSrc.registered
    || state.conversationBusy
    || (state.streaming && !conversationStreamIsReusable())
  ) {
    if (text && activeSrc?.path && !activeSrc.registered) {
      statusText.textContent = 'Register the active avatar before starting a conversation';
    }
    return;
  }

  appendChatMessage('user', text);
  const assistantMessage = appendChatMessage('assistant pending');
  chatInput.value = '';
  state.conversationBusy = true;
  state.chatAbort = new AbortController();
  statusText.textContent = 'Thinking...';
  updateStartButton();

  let audioEvent = null;
  let conversationStreamStarted = false;
  const streamingTtsEnabled = $('streamingTts').checked;
  try {
    if (streamingTtsEnabled) {
      await prepareConversationTtsAudio();
    } else {
      stopConversationTtsAudio();
    }
    const response = await fetch('/api/conversation/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      signal: state.chatAbort.signal,
      body: JSON.stringify({
        conversation_id: state.conversationId,
        message: text,
        system_prompt: $('systemPrompt').value.trim() || null,
        model: $('llmModel').value.trim() || null,
        tts_provider: $('ttsProvider').value || null,
        tts_model: $('ttsModel').value.trim() || null,
        voice: $('ttsVoice').value.trim() || null,
        streaming_tts: streamingTtsEnabled,
      }),
    });
    if (!response.ok || !response.body) {
      throw new Error(await response.text() || `HTTP ${response.status}`);
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { value, done } = await reader.read();
      buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';
      for (const line of lines) {
        if (!line.trim()) continue;
        const event = JSON.parse(line);
        if (event.type === 'delta') {
          assistantMessage.textContent += event.text || '';
          chatMessages.scrollTop = chatMessages.scrollHeight;
        } else if (event.type === 'reply_finished') {
          assistantMessage.textContent = event.text || assistantMessage.textContent;
          assistantMessage.classList.remove('pending');
        } else if (event.type === 'tts_started') {
          statusText.textContent = 'Synthesizing speech...';
        } else if (event.type === 'tts_stream_started') {
          statusText.textContent = 'Opening streaming speech channel...';
          await startFlowStream({
            conversationStreamId: event.stream_id,
          });
          conversationStreamStarted = (
            state.streaming && streamUsesConversationTts
          );
          if (!conversationStreamStarted) {
            throw new Error('Unable to start the streaming speech channel');
          }
        } else if (event.type === 'audio_chunk_ready') {
          statusText.textContent = (
            `Streaming speech segment ${(event.index ?? 0) + 1}...`
          );
        } else if (event.type === 'audio_ready') {
          audioEvent = event;
        } else if (event.type === 'error') {
          throw new Error(event.msg || 'Conversation failed');
        }
      }
      if (done) break;
    }

    assistantMessage.classList.remove('pending');
    if (!audioEvent) throw new Error('The response audio was not generated');
    installConversationAudio(audioEvent);
    statusText.textContent = conversationStreamStarted
      ? (state.streaming ? 'Streaming conversation...' : 'Ready for next message')
      : 'Preparing TalkLikeYou...';
  } catch (error) {
    assistantMessage.classList.remove('pending');
    if (error.name === 'AbortError') {
      if (!assistantMessage.textContent) assistantMessage.remove();
      statusText.textContent = 'Stopped';
    } else {
      if (!assistantMessage.textContent) assistantMessage.textContent = `Error: ${error.message}`;
      statusText.textContent = `Conversation error: ${error.message}`;
    }
    if (conversationStreamStarted) cleanup();
    else stopConversationTtsAudio();
  } finally {
    state.chatAbort = null;
    state.conversationBusy = false;
    updateStartButton();
  }

  if (audioEvent && !conversationStreamStarted) {
    stopConversationTtsAudio();
    startFlowStream();
  }
}

sendBtn.addEventListener('click', () => sendConversationMessage());
chatInput.addEventListener('keydown', event => {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    sendConversationMessage();
  }
});

let mediaRecorder = null;
let recordingStream = null;
let recordingChunks = [];
let speechRecognition = null;

recordBtn.addEventListener('click', async () => {
  if (speechRecognition) {
    speechRecognition.stop();
    return;
  }
  if (mediaRecorder?.state === 'recording') {
    mediaRecorder.stop();
    return;
  }
  if (!state.sttConfigured) {
    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Recognition) {
      statusText.textContent = 'STT is not configured';
      return;
    }
    const recognition = new Recognition();
    speechRecognition = recognition;
    recognition.lang = navigator.language || 'zh-CN';
    recognition.interimResults = false;
    recognition.continuous = false;
    recordBtn.classList.add('recording');
    recordBtn.textContent = 'Stop';
    statusText.textContent = 'Listening...';
    recognition.onresult = event => {
      const text = event.results?.[0]?.[0]?.transcript || '';
      if (text.trim()) sendConversationMessage(text);
    };
    recognition.onerror = event => {
      recordBtn.classList.remove('recording');
      recordBtn.textContent = 'Record';
      statusText.textContent = `Speech recognition error: ${event.error}`;
    };
    recognition.onend = () => {
      speechRecognition = null;
      recordBtn.classList.remove('recording');
      recordBtn.textContent = 'Record';
      updateStartButton();
    };
    recognition.start();
    return;
  }
  try {
    recordingStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recordingChunks = [];
    chatInput.value = '';
    mediaRecorder = new MediaRecorder(recordingStream);
    mediaRecorder.ondataavailable = event => {
      if (event.data.size) recordingChunks.push(event.data);
    };
    mediaRecorder.onstop = async () => {
      recordingStream?.getTracks().forEach(track => track.stop());
      recordingStream = null;
      recordBtn.classList.remove('recording');
      recordBtn.textContent = 'Record';
      state.conversationBusy = true;
      statusText.textContent = 'Transcribing...';
      updateStartButton();
      try {
        const blob = new Blob(
          recordingChunks,
          { type: mediaRecorder.mimeType || 'audio/webm' },
        );
        const form = new FormData();
        form.append('file', blob, 'recording.webm');
        const response = await fetch(
          '/api/conversation/transcribe',
          { method: 'POST', body: form },
        );
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.detail || 'Transcription failed');
        chatInput.value = payload.text || '';
      } catch (error) {
        statusText.textContent = `STT error: ${error.message}`;
      } finally {
        state.conversationBusy = false;
        updateStartButton();
      }
      if (chatInput.value.trim()) sendConversationMessage();
    };
    mediaRecorder.start(250);
    recordBtn.classList.add('recording');
    recordBtn.textContent = 'Stop';
    statusText.textContent = 'Recording...';
  } catch (error) {
    statusText.textContent = `Microphone error: ${error.message}`;
  }
});

clearChatBtn.addEventListener('click', async () => {
  state.chatAbort?.abort();
  speechRecognition?.stop();
  await fetch('/api/conversation/reset', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ conversation_id: state.conversationId }),
  }).catch(() => {});
  chatMessages.querySelectorAll('.chat-message').forEach(message => message.remove());
  chatEmpty.hidden = false;
  statusText.textContent = 'Conversation cleared';
});

stopBtn.addEventListener('click', () => {
  state.chatAbort?.abort();
  speechRecognition?.stop();
  if (mediaRecorder?.state === 'recording') mediaRecorder.stop();
  if (state.microphoneStreaming) {
    state.microphoneFinishing = true;
    stopLiveMicrophone(true);
    stopBtn.disabled = true;
    statusText.textContent = 'Finishing microphone stream...';
    return;
  }
  stopLiveMicrophone(false);
  closeStreamSocket(state.ws, true);
  statusText.textContent = 'Stopped';
  cleanup();
});

function cleanup() {
  state.streaming = false;
  state.microphoneFinishing = false;
  stopLiveMicrophone(false);
  stopConversationTtsAudio();
  closeStreamSocket();
  if (displayRaf) { cancelAnimationFrame(displayRaf); displayRaf = null; }
  frameBuffer.clear();
  frameBuffer = new Map();
  audioStarted = false;
  continuousIdle = false;
  streamHasAudio = false;
  streamUsesMicrophone = false;
  streamUsesConversationTts = false;
  idleClockStartedAt = null;
  networkRebuffering = false;
  missingVideoFrameSince = null;
  if (!streamDone) audioPlayer.pause();
  liveBadge.style.display = 'none'; startBtn.disabled = false; stopBtn.disabled = true;
  document.getElementById('display').classList.remove('active','streaming');
  updateStartButton(); updateFps();
}
function finalCleanup() {
  state.streaming = false;
  state.microphoneFinishing = false;
  stopLiveMicrophone(false);
  stopConversationTtsAudio();
  closeStreamSocket();
  if (displayRaf) { cancelAnimationFrame(displayRaf); displayRaf = null; }
  frameBuffer.clear();
  continuousIdle = false;
  streamHasAudio = false;
  streamUsesMicrophone = false;
  streamUsesConversationTts = false;
  idleClockStartedAt = null;
  networkRebuffering = false;
  missingVideoFrameSince = null;
  liveBadge.style.display = 'none'; startBtn.disabled = false; stopBtn.disabled = true;
  statusText.textContent = state.mode === 'conversation'
    ? 'Ready for next message'
    : (
      state.mode === 'audio' && state.microphoneSelected
        ? `Microphone stopped · ${state.frameCount} frames`
        : `Playback complete · ${state.frameCount} frames`
    );
  updateStartButton(); updateFps();
}
function updateFps() {
  const elapsed = (performance.now() - state.fpsTimer) / 1000;
  if (elapsed > 0 && receivedFrameCount > 0) {
    fpsBadge.textContent = (
      `${(receivedFrameCount / elapsed).toFixed(1)}`
      + `/${streamRenderFps.toFixed(0)} fps`
    );
  }
}

function updateMotionControlState() {
  const videoDubbing = state.mode === 'video';
  const liveMicrophone = (
    state.mode === 'audio' && state.microphoneSelected
  );
  $('stage0').disabled = false;
  $('neutral').disabled = false;
  const perFrameNormalizeAllowed = (
    videoDubbing && $('stage0').checked && !$('neutral').checked
  );
  $('perFrameNormalizeDeltaRow').hidden = !videoDubbing;
  $('perFrameNormalizeDelta').disabled = !perFrameNormalizeAllowed;
  $('posePersonIdSetting').hidden = videoDubbing;
  $('poseGuidanceSetting').hidden = videoDubbing;
  $('dittoPoseRow').hidden = videoDubbing;
  $('dittoPose').disabled = videoDubbing;
  $('continuousIdle').disabled = videoDubbing || liveMicrophone;
  $('microphonePlaybackRow').hidden = !liveMicrophone;
  const poseControlsDisabled = (
    videoDubbing || $('dittoPose').checked
  );
  $('posePersonId').disabled = poseControlsDisabled;
  $('poseGuidance').disabled = poseControlsDisabled;
}

$('dittoPose').addEventListener('change', updateMotionControlState);
$('stage0').addEventListener('change', () => {
  updateMotionControlState();
  updateStartButton();
});
$('neutral').addEventListener('change', () => {
  updateMotionControlState();
  updateStartButton();
});
$('faceIdx').addEventListener('change', () => {
  currentAvatarCropSettings();
  invalidateAvatarRegistrations(
    'Face index changed · register avatars again',
    true,
  );
});
$('cropScale').addEventListener('change', () => {
  currentAvatarCropSettings();
  invalidateAvatarRegistrations(
    'Crop scale changed · register avatars again',
    true,
  );
});
$('continuousIdle').addEventListener('change', updateStartButton);
$('microphonePlayback').addEventListener(
  'change',
  updateLiveMicrophonePlaybackGain,
);
$('ttsProvider').addEventListener('change', () => updateTtsProviderChoices(true));
$('streamingTts').addEventListener('change', () => {
  saveState();
  updateConversationSummary();
});
$('llmModel').addEventListener('change', updateConversationSummary);
$('ttsModel').addEventListener('change', updateConversationSummary);
$('ttsVoice').addEventListener('change', updateConversationSummary);

const requestedMode = new URLSearchParams(location.search).get('mode');
const initialMode = requestedMode || localStorage.getItem('talklikeyou_input_mode');
if (initialMode === 'conversation' || initialMode === 'video') {
  setMode(initialMode);
}
loadState();
</script>
