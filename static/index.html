<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalkLikeYou — Real-time Talking Head</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #06080f;
    --surface: rgba(17,22,32,0.6);
    --border: rgba(255,255,255,0.06);
    --border-light: rgba(255,255,255,0.1);
    --text: #cdd4e4;
    --text-dim: #5e698a;
    --text-muted: #3e4660;
    --accent: #6a9fff;
    --accent-glow: rgba(106,159,255,0.2);
    --accent-dim: #3a5fa0;
    --danger: #ff6b7a;
    --success: #5eeab4;
    --radius: 10px;
    --radius-sm: 6px;
    --font-mono: 'DM Mono', monospace;
    --font-display: 'Instrument Serif', serif;
    --font-body: 'Space Grotesk', sans-serif;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 13px;
    line-height: 1.55;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(ellipse at 50% -20%, rgba(106,159,255,0.06) 0%, transparent 70%),
      radial-gradient(ellipse at 80% 30%, rgba(94,234,180,0.03) 0%, transparent 50%);
  }

  body::after {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:9999;
    opacity:0.02;
    background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  }

  .app { max-width:1500px; margin:0 auto; padding:24px 28px 16px; display:flex; flex-direction:column; gap:20px; min-height:100vh; }

  .header {
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:14px 20px;
    backdrop-filter:blur(20px);
    background:rgba(17,22,32,0.5);
    border-radius:var(--radius);
    border:1px solid var(--border);
  }
  .header h1 {
    font-family:var(--font-display); font-size:1.8rem; font-weight:400;
    font-style:italic; color:#fff; letter-spacing:-0.03em;
  }
  .header-brand { min-width:0; }
  .header .meta {
    display:block; margin-top:2px;
    font-family:var(--font-mono); font-size:10px; color:var(--text-dim);
    text-transform:uppercase; letter-spacing:0.12em;
  }

  .workspace {
    display:grid; grid-template-columns:minmax(420px,1fr) minmax(480px,620px);
    align-items:start; gap:22px; min-width:0;
  }

  .center-stage {
    display:flex; flex-direction:column; justify-content:flex-start;
    position:sticky; top:20px; min-width:0;
  }

  .display-area {
    position:relative;
    background:radial-gradient(circle at center, rgba(106,159,255,0.06), rgba(0,0,0,1) 70%);
    border-radius:var(--radius); overflow:hidden;
    border:1px solid rgba(106,159,255,0.15);
    aspect-ratio:16/10; min-height:360px;
    box-shadow:
      0 0 80px rgba(106,159,255,0.08),
      inset 0 0 60px rgba(0,0,0,0.7);
    transition:all 0.6s var(--ease);
  }
  .display-area.active { box-shadow:0 0 100px rgba(106,159,255,0.12),inset 0 0 60px rgba(0,0,0,0.5); }
  .display-area.streaming {
    animation:glowPulse 2s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%,100% { box-shadow:0 0 40px rgba(106,159,255,0.08),inset 0 0 60px rgba(0,0,0,0.7); }
    50%     { box-shadow:0 0 90px rgba(106,159,255,0.18),inset 0 0 60px rgba(0,0,0,0.7); }
  }

  .display-area::before {
    content:''; position:absolute; inset:0; pointer-events:none; z-index:2;
    background:linear-gradient(180deg,rgba(0,0,0,0.2) 0%,transparent 40%,transparent 60%,rgba(0,0,0,0.2) 100%);
  }

  .display-area img { width:100%; height:100%; object-fit:contain; display:block; position:relative; z-index:1; }

  .display-placeholder {
    position:absolute; inset:0; display:flex; z-index:1;
    flex-direction:column; align-items:center; justify-content:center;
    color:var(--text-muted); pointer-events:none;
  }
  .display-placeholder .icon { font-size:56px; margin-bottom:16px; opacity:0.15; }
  .display-placeholder .text {
    font-family:var(--font-body); font-size:11px; font-weight:500;
    letter-spacing:0.08em; text-transform:uppercase;
  }

  .display-overlay { position:absolute; top:12px; right:12px; display:flex; gap:8px; pointer-events:none; z-index:3; }
  .badge {
    font-family:var(--font-mono); font-size:9px; font-weight:500;
    padding:4px 10px; border-radius:20px; letter-spacing:0.05em;
    backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.06);
  }
  .badge-fps { background:rgba(0,0,0,0.7); color:var(--success); }
  .badge-source { background:rgba(0,0,0,0.7); color:var(--accent); }
  .badge-live {
    background:linear-gradient(90deg,#ff4d6d,#ff8fa3); color:#fff; border:none;
    box-shadow:0 0 16px rgba(255,77,109,0.3);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.55} }

  .control-dock {
    display:flex; flex-direction:column; gap:12px;
    position:relative; min-width:0;
  }

  .source-strip {
    display:flex; gap:8px; overflow-x:auto; padding:4px 0 8px;
    scroll-behavior:smooth; align-items:flex-end;
  }
  .source-strip::-webkit-scrollbar { height:2px; }
  .source-strip::-webkit-scrollbar-track { background:transparent; }
  .source-strip::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.08); border-radius:2px; }

  .source-card {
    flex-shrink:0; width:88px; cursor:pointer;
    border-radius:var(--radius-sm); overflow:hidden;
    border:1.5px solid rgba(255,255,255,0.04);
    backdrop-filter:blur(12px); background:rgba(17,22,32,0.55);
    transition:all 0.3s var(--ease); position:relative;
  }
  .source-card:hover {
    transform:translateY(-6px) scale(1.03);
    box-shadow:0 10px 30px rgba(0,0,0,0.5),0 0 20px rgba(106,159,255,0.15);
    border-color:rgba(106,159,255,0.3);
  }
  .source-card.active {
    border-color:var(--accent);
    box-shadow:0 0 0 2px var(--accent-glow),0 8px 24px rgba(0,0,0,0.4);
  }
  .source-card img { width:100%; height:88px; object-fit:cover; display:block; }
  .source-card video { width:100%; height:88px; object-fit:cover; display:block; }
  .source-card .name {
    font-family:var(--font-body); font-size:8px; font-weight:500;
    padding:4px 5px; text-align:center; color:var(--text-dim);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .source-card.active .name { color:var(--accent); }
  .source-card .remove {
    position:absolute; top:4px; right:4px; width:18px; height:18px;
    border-radius:50%; background:rgba(0,0,0,0.8); color:var(--danger);
    border:none; font-size:11px; cursor:pointer; display:none;
    align-items:center; justify-content:center; transition:background 0.2s;
  }
  .source-card .remove:hover { background:var(--danger); color:#fff; }
  .source-card:hover .remove { display:flex; }
  .source-card .avatar-actions {
    position:absolute; left:4px; right:4px; top:64px; display:flex; gap:3px;
    z-index:2;
  }
  .source-card .avatar-action {
    flex:1; min-width:0; height:19px; padding:0 2px;
    border:1px solid rgba(106,159,255,.45); border-radius:4px;
    background:rgba(5,8,15,.86); color:var(--accent); cursor:pointer;
    font:600 7px var(--font-body);
  }
  .source-card .avatar-action:hover:not(:disabled) {
    background:var(--accent); color:#06080f;
  }
  .source-card .avatar-action:disabled { cursor:default; }
  .source-card .avatar-action.ready {
    border-color:rgba(94,234,180,.45); color:var(--success);
  }
  .source-card .avatar-action.failed {
    border-color:rgba(255,107,122,.45); color:var(--danger);
  }
  .registration-progress {
    position:absolute; left:0; right:0; top:84px; height:4px;
    background:rgba(0,0,0,.72); z-index:3;
  }
  .registration-progress span {
    display:block; width:0; height:100%; background:var(--accent);
    transition:width .25s ease;
  }

  .add-source {
    flex-shrink:0; width:88px; height:88px;
    border:1.5px dashed rgba(255,255,255,0.08); border-radius:var(--radius-sm);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--text-muted); font-size:26px; font-weight:300;
    transition:all 0.3s var(--ease);
    backdrop-filter:blur(12px); background:rgba(17,22,32,0.4);
  }
  .add-source:hover { border-color:var(--accent-dim); color:var(--accent); background:rgba(106,159,255,0.08); }
  .add-source input { display:none; }

  .audio-strip {
    display:flex; gap:8px; overflow-x:auto; padding:4px 0 8px;
    scroll-behavior:smooth; align-items:flex-end;
  }
  .audio-strip::-webkit-scrollbar { height:2px; }
  .audio-strip::-webkit-scrollbar-track { background:transparent; }
  .audio-strip::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.08); border-radius:2px; }
  .audio-card {
    flex-shrink:0; width:120px; cursor:pointer;
    border-radius:var(--radius-sm); overflow:hidden;
    border:1.5px solid rgba(255,255,255,0.04);
    backdrop-filter:blur(12px); background:rgba(17,22,32,0.55);
    transition:all 0.3s var(--ease); position:relative; padding:10px 12px;
  }
  .audio-card:hover { transform:translateY(-3px); box-shadow:0 8px 24px rgba(0,0,0,0.5),0 0 16px rgba(94,234,180,0.1); }
  .audio-card.active { border-color:var(--success); box-shadow:0 0 0 2px rgba(94,234,180,0.2); }
  .microphone-card {
    height:72px; color:var(--text); text-align:left;
    font-family:var(--font-body);
  }
  .microphone-card .mic-icon {
    display:block; color:var(--success); font-size:17px; line-height:20px;
  }
  .microphone-card .name, .microphone-card .size { display:block; }
  .microphone-card:disabled { opacity:.35; cursor:not-allowed; transform:none; }
  .microphone-card.live .mic-icon {
    color:var(--danger); animation:pulse 1.1s ease-in-out infinite;
  }
  .audio-card .name {
    font-family:var(--font-body); font-size:10px; font-weight:500;
    color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .audio-card .size { font-size:9px; color:var(--text-dim); margin-top:2px; }
  .audio-card .send-chunk {
    width:100%; height:22px; margin-top:7px; padding:0 6px;
    border:1px solid rgba(94,234,180,.35); border-radius:4px;
    background:rgba(94,234,180,.08); color:var(--success); cursor:pointer;
    font:600 8px var(--font-body);
  }
  .audio-card .send-chunk:hover:not(:disabled) {
    background:var(--success); color:#06080f;
  }
  .audio-card .send-chunk:disabled { opacity:.35; cursor:not-allowed; }
  .audio-card .remove {
    position:absolute; top:4px; right:4px; width:18px; height:18px;
    border-radius:50%; background:rgba(0,0,0,0.8); color:var(--danger);
    border:none; font-size:11px; cursor:pointer; display:none;
    align-items:center; justify-content:center;
  }
  .audio-card .remove:hover { background:var(--danger); color:#fff; }
  .audio-card:hover .remove { display:flex; }
  audio { height:28px; border-radius:var(--radius-sm); flex-shrink:0; }

  .mode-switch {
    display:inline-grid; grid-template-columns:repeat(3,1fr); align-self:flex-start;
    padding:3px; border:1px solid var(--border-light); border-radius:7px;
    background:rgba(0,0,0,.28);
  }
  .mode-btn {
    min-width:112px; height:30px; padding:0 14px; border:0; border-radius:5px;
    background:transparent; color:var(--text-dim); cursor:pointer;
    font:600 10px var(--font-body);
  }
  .mode-btn.active { background:rgba(106,159,255,.16); color:var(--accent); }
  .mode-btn:disabled { opacity:.35; cursor:not-allowed; }
  .conversation-panel {
    display:flex; flex-direction:column; gap:10px;
    border-top:1px solid var(--border); padding-top:12px;
  }
  .conversation-panel[hidden] { display:none; }
  .conversation-head {
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .conversation-model {
    min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    color:var(--text-dim); font:10px var(--font-mono);
  }
  .text-action {
    border:0; background:transparent; color:var(--text-dim); cursor:pointer;
    font:600 10px var(--font-body);
  }
  .text-action:hover { color:var(--text); }
  .chat-messages {
    display:flex; flex-direction:column; gap:7px; max-height:190px;
    overflow-y:auto; padding:2px 4px 2px 0;
  }
  .chat-empty { color:var(--text-muted); font-size:10px; padding:10px 0; }
  .chat-message {
    max-width:82%; padding:8px 11px; border-radius:6px;
    white-space:pre-wrap; overflow-wrap:anywhere; font-size:12px;
  }
  .chat-message.user {
    align-self:flex-end; color:#f4f7ff; background:rgba(106,159,255,.18);
    border:1px solid rgba(106,159,255,.2);
  }
  .chat-message.assistant {
    align-self:flex-start; color:var(--text); background:rgba(255,255,255,.045);
    border:1px solid var(--border);
  }
  .chat-message.pending::after {
    content:'|'; color:var(--accent); animation:cursorBlink .8s steps(1) infinite;
  }
  @keyframes cursorBlink { 50% { opacity:0; } }
  .composer {
    display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:8px;
    align-items:end;
  }
  .composer textarea {
    width:100%; min-height:42px; max-height:112px; resize:vertical;
    border:1px solid var(--border-light); border-radius:6px;
    background:rgba(0,0,0,.3); color:var(--text); padding:10px 11px;
    font:12px/1.45 var(--font-body); outline:none;
  }
  .composer textarea:focus { border-color:var(--accent-dim); }
  .composer .btn { height:42px; padding:0 16px; }
  .record-btn.recording { border-color:var(--danger); color:var(--danger); }
  .conversation-options summary {
    cursor:pointer; color:var(--text-muted); font-size:9px;
  }
  .conversation-options-grid {
    display:grid;
    grid-template-columns:repeat(4,minmax(120px,1fr));
    gap:10px; padding-top:8px;
  }
  .conversation-options-grid .system-prompt { grid-column:span 2; }
  .conversation-options textarea,
  .conversation-options input,
  .conversation-options select {
    width:100%; min-height:34px; border:1px solid var(--border-light);
    border-radius:5px; background:rgba(0,0,0,.3); color:var(--text);
    padding:7px 8px; font:10px var(--font-body);
  }
  .conversation-options input:disabled {
    opacity:.4; cursor:not-allowed;
  }
  .conversation-options .conversation-toggle input {
    width:18px; min-height:18px; margin-top:7px; accent-color:var(--accent);
  }

  .settings {
    border-top:1px solid var(--border); border-bottom:1px solid var(--border);
    padding:10px 0;
  }
  .settings summary { cursor:pointer; color:var(--text-dim); font-size:10px; font-weight:600; }
  .settings-grid {
    display:grid; grid-template-columns:repeat(4,minmax(110px,1fr)); gap:10px 14px;
    padding-top:12px;
  }
  .setting { display:flex; flex-direction:column; gap:4px; min-width:0; }
  .setting span { font-size:9px; color:var(--text-dim); }
  .setting input[type="number"] {
    width:100%; height:32px; border:1px solid var(--border-light); border-radius:5px;
    background:rgba(0,0,0,.3); color:var(--text); padding:0 8px; font-family:var(--font-mono);
  }
  .toggle-row { display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; min-height:32px; }
  .toggle-row label { display:flex; align-items:center; gap:6px; color:var(--text-dim); font-size:10px; }
  .controls {
    display:flex; gap:10px; align-items:center;
    padding:12px 18px;
    backdrop-filter:blur(20px); background:rgba(17,22,32,0.55);
    border-radius:16px; border:1px solid rgba(255,255,255,0.08);
  }
  .btn {
    font-family:var(--font-body); font-size:12px; font-weight:600;
    padding:10px 20px; border-radius:8px; cursor:pointer;
    border:1px solid transparent; transition:all 0.2s var(--ease);
    letter-spacing:0.02em;
  }
  .btn-primary {
    background:var(--accent); color:#06080f; border-color:var(--accent);
  }
  .btn-primary:hover:not(:disabled) { filter:brightness(1.1); box-shadow:0 4px 20px var(--accent-glow); }
  .btn-primary:disabled { opacity:0.2; cursor:not-allowed; filter:none; }
  .btn-ghost {
    background:transparent; border-color:rgba(255,255,255,0.1); color:var(--text-dim);
  }
  .btn-ghost:hover { border-color:var(--text-dim); color:var(--text); }
  .status-text {
    flex:1; font-size:10px; color:var(--text-dim);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .system-actions {
    display:flex; flex-direction:column; gap:5px; flex:0 0 auto;
  }
  .system-action {
    min-width:104px; height:27px; padding:0 10px; border-radius:6px;
    border:1px solid rgba(255,255,255,.1); background:rgba(0,0,0,.2);
    color:var(--text-dim); cursor:pointer; font:600 9px var(--font-body);
  }
  .system-action:hover:not(:disabled) {
    border-color:var(--accent-dim); color:var(--accent);
  }
  .system-action.danger:hover:not(:disabled) {
    border-color:var(--danger); color:var(--danger);
  }
  .system-action:disabled { opacity:.35; cursor:not-allowed; }

  .row-label {
    font-family:var(--font-body); font-size:8px; font-weight:600;
    text-transform:uppercase; letter-spacing:0.14em;
    color:var(--text-muted); margin-bottom:6px;
  }
  .source-head {
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .source-head .text-action { margin-bottom:6px; }
  .text-action:disabled { opacity:.35; cursor:not-allowed; }

  .vid-tag {
    position:absolute; top:3px; left:3px;
    background:var(--accent); color:#06080f;
    font-family:var(--font-body); font-size:7px; font-weight:700;
    padding:1px 5px; border-radius:3px; letter-spacing:0.06em;
  }

  @media (max-width:800px) {
    .app { padding:16px 12px; gap:14px; }
    .header { flex-wrap:wrap; }
    .mode-switch { width:100%; }
    .display-area { min-height:280px; }
    .settings-grid { grid-template-columns:repeat(2,minmax(110px,1fr)); }
    .conversation-options-grid { grid-template-columns:1fr; }
    .composer { grid-template-columns:minmax(0,1fr) auto; }
    .composer .send-btn { grid-column:1 / -1; }
    .chat-message { max-width:92%; }
    .header .meta { display:none; }
    .mode-btn { min-width:0; padding:0 8px; }
  }
  @media (max-width:1100px) {
    .workspace { display:flex; flex-direction:column; }
    .control-dock { order:1; width:100%; }
    .center-stage { order:2; position:relative; top:auto; width:100%; }
  }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="header-brand">
      <h1>TalkLikeYou</h1>
      <span class="meta">Real-time Talking Head &nbsp;·&nbsp; Streaming</span>
    </div>
    <div class="mode-switch" aria-label="Input mode">
      <button class="mode-btn active" id="audioModeBtn" type="button">Audio</button>
      <button class="mode-btn" id="videoModeBtn" type="button">Video dubbing</button>
      <button class="mode-btn" id="conversationModeBtn" type="button">Chat agent</button>
    </div>
  </div>

  <main class="workspace">
  <div class="center-stage">
    <div class="display-area" id="display">
      <img id="frame" alt="stream">
      <div class="display-placeholder" id="placeholder">
        <span class="icon">&#9679;</span>
        <span class="text">Ready &mdash; add sources &amp; audio, then Start</span>
      </div>
      <div class="display-overlay" id="overlay">
        <span class="badge badge-live" id="liveBadge" style="display:none">LIVE</span>
        <span class="badge badge-fps" id="fpsBadge" style="display:none">0 fps</span>
        <span class="badge badge-source" id="sourceBadge">&mdash;</span>
      </div>
    </div>
  </div>

  <div class="control-dock">
    <div class="source-head">
      <div class="row-label" id="sourcePoolLabel">Image avatars</div>
      <button class="text-action" id="clearAvatarCacheBtn" type="button">Clear cache</button>
    </div>
    <div class="source-strip" id="sourceStrip">
      <label class="add-source" title="Add source image/video">
        +<input type="file" id="sourceInput" accept="image/*" multiple>
      </label>
    </div>

    <div id="audioModePanel">
      <div class="audio-strip" id="audioStrip">
        <button class="audio-card microphone-card" id="microphoneInputBtn" type="button" title="Live playback is enabled; headphones are recommended">
          <span class="mic-icon">&#9679;</span>
          <span class="name">Live microphone</span>
          <span class="size">Live · use headphones</span>
        </button>

        <label class="setting"><span>Max image size (long edge)</span><input id="maxImageSize" type="number" min="64" max="4096" step="64" value="1024"></label>
        <label class="setting"><span>Face index</span><input id="faceIdx" type="number" min="0" step="1" value="0" title="Detected faces are indexed from left to right"></label>

        <label class="setting"><span>Playback buffer (frames)</span><input id="playbackBufferFrames" type="number" min="1" step="1" value="75"></label>
        <label class="setting"><span>Audio chunk (seconds)</span><input id="audioChunkSeconds" type="number" min="0.1" step="0.1" value="1.0"></label>

          <label><input id="stage0" type="checkbox" checked> Stage0</label>
          <label><input id="neutral" type="checkbox" checked> Neutral</label>
          <label id="perFrameNormalizeDeltaRow" hidden><input id="perFrameNormalizeDelta" type="checkbox"> Per-frame normalize ΔE</label>
          <label id="dittoPoseRow"><input id="dittoPose" type="checkbox" checked> Ditto pose</label>
          <label><input id="pasteBack" type="checkbox" checked> Paste back</label>
          <label><input id="continuousIdle" type="checkbox"> Continuous idle</label>
          <label id="microphonePlaybackRow" hidden><input id="microphonePlayback" type="checkbox" checked> Play microphone audio</label>
        </div>

      <button class="btn btn-primary" id="startBtn" disabled>Start Streaming</button>
      <button class="btn btn-ghost" id="stopBtn" disabled>Stop</button>

        <button class="system-action" id="unloadModelsBtn" type="button">Release VRAM</button>
        <button class="system-action danger" id="shutdownServiceBtn" type="button">Exit service</button>

</div>

<script>
const state = {
  sources: [],
  activeSourceIds: {
    standard: null,
    video: null,
  },
  get activeSourceId() {
    return this.activeSourceIds[this.mode === 'video' ? 'video' : 'standard'];
  },
  set activeSourceId(value) {
    this.activeSourceIds[this.mode === 'video' ? 'video' : 'standard'] = value;
  },
  audioPath: null,
  audioUrl: null,
  audioFileName: null,
  microphoneSelected: false,
  microphoneStreaming: false,
  microphoneFinishing: false,
  ws: null,
  streaming: false,
  frameCount: 0,
  fpsTimer: 0,
  activeSourceName: '—',
  mode: 'audio',
  conversationBusy: false,
  conversationConfigured: false,
  sttConfigured: false,
  chatAbort: null,
  clearingAvatarCache: false,
  systemBusy: false,
  serviceStopping: false,
  modelsLoaded: true,
  conversationOptions: {
    ttsModels: {},
    ttsVoices: {},
  },
};
state.conversationId = localStorage.getItem('talklikeyou_conversation_id')
  || (crypto.randomUUID ? crypto.randomUUID() : `conversation_${Date.now()}`);
localStorage.setItem('talklikeyou_conversation_id', state.conversationId);

function saveState() {
  const d = {
    srcs: state.sources.map(s => ({
      id: s.id,
      name: s.name,
      path: s.path,
      url: s.url,
      avatarId: s.avatarId,
      registered: s.registered,
      neutralized: s.neutralized,
      isVideo: s.isVideo,
    })),
    actSrcStandard: state.activeSourceIds.standard,
    actSrcVideo: state.activeSourceIds.video,
    audios: state.audioFiles.map(a => ({ id: a.id, name: a.name, path: a.path, url: a.url })),
    actAud: state.activeAudioId,
    faceIdx: Math.max(0, Math.round(+$('faceIdx').value || 0)),
    cropScale: Math.max(0.1, +$('cropScale').value || 2.3),
    streamingTts: $('streamingTts').checked,
  };
  localStorage.setItem('talklikeyou', JSON.stringify(d));
}
function loadState() {
  fetch('/api/status').then(r => r.json()).then(s => {
    const conversation = s.conversation || {};
    state.conversationConfigured = !!(
      conversation.llm_configured && conversation.tts_configured
    );
    state.sttConfigured = !!conversation.stt_configured;
    state.modelsLoaded = s.models_loaded !== false;
    populateDatalist('llmModelOptions', conversation.llm_models || []);
    $('llmModel').value = $('llmModel').value || conversation.llm_model || '';
    state.conversationOptions.ttsModels = conversation.tts_models || {};
    state.conversationOptions.ttsVoices = conversation.tts_voices || {};
    const selectedTtsProvider = populateTtsProviders(
      conversation.tts_providers || [],
      conversation.tts_provider || '',
    );
    $('ttsModel').value = conversation.tts_model || '';
    $('ttsVoice').value = conversation.tts_voice || '';
    updateTtsProviderChoices(
      selectedTtsProvider !== (conversation.tts_provider || ''),
    );
    updateConversationSummary();
    recordBtn.title = state.sttConfigured
      ? 'Record voice'
      : 'Use browser speech recognition';
    if (state.mode === 'conversation') {
      statusText.textContent = state.conversationConfigured
        ? 'Ready for conversation'
        : 'Conversation service is not configured';
    }
    updateStartButton();
    const prev = localStorage.getItem('talklikeyou_time');
    if (prev && +prev !== s.start_time) {
      // Server restarted — start fresh
      localStorage.removeItem('talklikeyou'); localStorage.removeItem('talklikeyou_time');
      updateStartButton();
      return;
    }
    localStorage.setItem('talklikeyou_time', s.start_time);
    try {
      const raw = localStorage.getItem('talklikeyou');
      if (!raw) return;
      const d = JSON.parse(raw);
      if (Number.isFinite(+d.faceIdx)) {
        $('faceIdx').value = String(Math.max(0, Math.round(+d.faceIdx)));
      }
      if (Number.isFinite(+d.cropScale) && +d.cropScale > 0) {
        $('cropScale').value = String(+d.cropScale);
      }
      if (typeof d.streamingTts === 'boolean') {
        $('streamingTts').checked = d.streamingTts;
      }
      if (d.srcs) { d.srcs.forEach(s => { state.sources.push({
        id: s.id, name: s.name, path: s.path, url: s.url, blobUrl: s.url,
        file: null, avatarId: s.avatarId, registered: !!s.registered,
        neutralized: !!s.neutralized,
        isVideo: !!s.isVideo, registrationState: s.registered ? 'registered' : 'idle',
        registrationProgress: s.registered ? 100 : 0,
      }); });
        sourceIdCounter = Math.max(
          sourceIdCounter,
          ...state.sources.map(source => +(source.id.match(/^src_(\d+)$/)?.[1] || 0)),
        );
        state.activeSourceIds.standard = d.actSrcStandard || null;
        state.activeSourceIds.video = d.actSrcVideo || null;
        if (!state.activeSourceIds.standard) {
          state.activeSourceIds.standard = state.sources.find(
            source => !isVideoSource(source),
          )?.id || null;
        }
        if (!state.activeSourceIds.video) {
          state.activeSourceIds.video = state.sources.find(
            source => isVideoSource(source),
          )?.id || null;
        }
        const restoredActive = state.sources.find(
          source => source.id === state.activeSourceId,
        );
        state.activeSourceName = restoredActive?.name || '—';
        updateBadges();
        renderSources(); }
      if (d.audios?.length) {
        state.audioFiles = d.audios
          .filter(audio => audio.path && audio.url)
          .map(audio => ({ ...audio, file: null }));
        const explicitlyNoAudio = (
          Object.prototype.hasOwnProperty.call(d, 'actAud')
          && d.actAud === null
        );
        const cur = explicitlyNoAudio
          ? null
          : (
            state.audioFiles.find(audio => audio.id === d.actAud)
            || state.audioFiles[state.audioFiles.length - 1]
          );
        state.activeAudioId = cur?.id || null;
        if (cur) { state.audioPath = cur.path; state.audioUrl = cur.url; audioPlayer.src = cur.url; audioPlayer.hidden = false; }
        renderAudio(); }
    } catch(e) {}
  });
}

function populateDatalist(id, values) {
  const datalist = $(id);
  datalist.replaceChildren(...values.map(value => {
    const option = document.createElement('option');
    option.value = value;
    return option;
  }));
}

function populateTtsProviders(providers, configuredProvider) {
  const select = $('ttsProvider');
  const normalized = providers.map(provider => (
    typeof provider === 'string'
      ? { value: provider, label: provider }
      : provider
  )).filter(provider => provider?.value);
  if (!normalized.length && configuredProvider) {
    normalized.push({ value: configuredProvider, label: configuredProvider });
  }
  select.replaceChildren(...normalized.map(provider => {
    const option = document.createElement('option');
    option.value = provider.value;
    option.textContent = provider.label || provider.value;
    return option;
  }));
  if (normalized.some(provider => provider.value === configuredProvider)) {
    select.value = configuredProvider;
  }
  return select.value;
}

function updateTtsProviderChoices(resetValues = true) {
  const provider = $('ttsProvider').value;
  const models = state.conversationOptions.ttsModels[provider] || [];
  const voices = state.conversationOptions.ttsVoices[provider] || [];
  populateDatalist('ttsModelOptions', models);
  const currentVoice = $('ttsVoice').value;
  const voiceLabels = {
    'zh-CN-XiaoxiaoNeural': '女声 · 晓晓',
    'zh-CN-XiaoyiNeural': '女声 · 晓伊',
    'zh-CN-YunxiNeural': '男声 · 云希',
    'zh-CN-YunjianNeural': '男声 · 云健',
  };
  const normalizedVoices = voices.map(voice => (
    typeof voice === 'string'
      ? { value: voice, label: voiceLabels[voice] || voice }
      : voice
  ));
  $('ttsVoice').replaceChildren(...normalizedVoices.map(voice => {
    const option = document.createElement('option');
    option.value = voice.value;
    option.textContent = voice.label || voice.value;
    return option;
  }));
  $('ttsModel').disabled = provider === 'edge';
  if (resetValues) {
    $('ttsModel').value = models[0] || '';
    $('ttsVoice').value = normalizedVoices[0]?.value || '';
  } else if ([...$('ttsVoice').options].some(option => (
    option.value === currentVoice
  ))) {
    $('ttsVoice').value = currentVoice;
  }
  updateConversationSummary();
}

function updateConversationSummary() {
  if (!state.conversationConfigured) {
    conversationModel.textContent = state.conversationConfigured === false
      ? 'Conversation service is not configured'
      : 'Conversation service';
    return;
  }
  const model = $('llmModel').value.trim() || 'default model';
  const provider = $('ttsProvider').selectedOptions[0]?.textContent || 'TTS';
  conversationModel.textContent = `${model} · ${provider}`;
}


const $ = id => document.getElementById(id);
const sourceStrip = $('sourceStrip');
const sourcePoolLabel = $('sourcePoolLabel');
const sourceInput = $('sourceInput');
const audioInput = $('audioInput');
const microphoneInputBtn = $('microphoneInputBtn');
const audioPlayer = $('audioPlayer');
const frameImg = $('frame');
const placeholder = $('placeholder');
const liveBadge = $('liveBadge');
const fpsBadge = $('fpsBadge');
const sourceBadge = $('sourceBadge');
const startBtn = $('startBtn');
const stopBtn = $('stopBtn');
const statusText = $('statusText');
const audioModeBtn = $('audioModeBtn');
const videoModeBtn = $('videoModeBtn');
const conversationModeBtn = $('conversationModeBtn');
const audioModePanel = $('audioModePanel');
const conversationPanel = $('conversationPanel');
const conversationModel = $('conversationModel');
const chatMessages = $('chatMessages');
const chatEmpty = $('chatEmpty');
const chatInput = $('chatInput');
const sendBtn = $('sendBtn');
const recordBtn = $('recordBtn');
const clearChatBtn = $('clearChatBtn');
const clearAvatarCacheBtn = $('clearAvatarCacheBtn');
const unloadModelsBtn = $('unloadModelsBtn');
const shutdownServiceBtn = $('shutdownServiceBtn');

let sourceIdCounter = 0;

function isVideoSource(src) {
  return !!src.isVideo
    || /\.(mp4|mov|avi|mkv|webm|m4v)(?:$|[?#])/i.test(src.name || '')
    || /\.(mp4|mov|avi|mkv|webm|m4v)(?:$|[?#])/i.test(src.path || '');
}

function visibleSources() {
  const videoPool = state.mode === 'video';
  return state.sources.filter(source => isVideoSource(source) === videoPool);
}

function sourceNeedsNeutralization(src) {
  const videoDubbing = state.mode === 'video' && isVideoSource(src);
  return videoDubbing && $('neutral').checked;
}

function renderSources() {
  sourceStrip.querySelectorAll('.source-card').forEach(c => c.remove());
  sourcePoolLabel.textContent = state.mode === 'video'
    ? 'Video dubbing avatars'
    : 'Image avatars · Audio & Conversation';
  visibleSources().forEach(src => {
    const isVideo = isVideoSource(src);
    src.isVideo = isVideo;
    const showNeutralizeAction = state.mode === 'video' && isVideo;
    const registrationState = src.registrationState || (src.registered ? 'registered' : 'idle');
    const registering = registrationState === 'queued' || registrationState === 'running';
    const registerLabel = src.registered
      ? 'Registered'
      : (
        registering
          ? `${src.registrationProgress || 0}%`
          : (registrationState === 'failed' ? 'Retry' : 'Register')
      );
    const registerClass = src.registered
      ? ' ready'
      : (registrationState === 'failed' ? ' failed' : '');
    const neutralState = src.neutralizationState || (src.neutralized ? 'neutralized' : 'idle');
    const neutralizing = neutralState === 'queued' || neutralState === 'running';
    const neutralLabel = src.neutralized
      ? 'Neutralized'
      : (neutralizing ? `${src.neutralizationProgress || 0}%` : (neutralState === 'failed' ? 'Retry neutral' : 'Neutralize'));
    const neutralClass = src.neutralized ? ' ready' : (neutralState === 'failed' ? ' failed' : '');
    const card = document.createElement('div');
    card.className = 'source-card' + (src.id === state.activeSourceId ? ' active' : '');
    card.dataset.id = src.id;
    card.innerHTML = `
      <button class="remove" data-action="remove">&times;</button>
      ${isVideo
        ? `<video src="${src.blobUrl}" muted playsinline preload="metadata"></video>`
        : `<img src="${src.blobUrl}" alt="${src.name}">`}
      ${isVideo ? '<span class="vid-tag">VID</span>' : ''}
      <div class="avatar-actions${showNeutralizeAction ? '' : ' single'}">
        <button class="avatar-action${registerClass}" data-action="register" ${registering || src.registered || neutralizing ? 'disabled' : ''}>${registerLabel}</button>
        ${showNeutralizeAction ? `<button class="avatar-action${neutralClass}" data-action="neutralize" ${!src.registered || registering || neutralizing || src.neutralized ? 'disabled' : ''}>${neutralLabel}</button>` : ''}
      </div>
      ${registering || neutralizing ? `<div class="registration-progress"><span style="width:${registering ? (src.registrationProgress || 0) : (src.neutralizationProgress || 0)}%"></span></div>` : ''}
      <div class="name">${src.name}</div>
    `;
    card.addEventListener('click', (e) => {
      if (e.target.dataset.action === 'remove') { removeSource(src.id); return; }
      if (e.target.dataset.action === 'register') {
        e.stopPropagation();
        registerAvatar(src);
        return;
      }
      if (e.target.dataset.action === 'neutralize') {
        e.stopPropagation();
        neutralizeAvatar(src);
        return;
      }
      setActiveSource(src.id);
    });
    sourceStrip.appendChild(card);
  });
  updateStartButton();
}

function addSources(files) {
  const videoPool = state.mode === 'video';
  let rejected = 0;
  for (const f of files) {
    const isVideo = f.type.startsWith('video/')
      || /\.(mp4|mov|avi|mkv|webm|m4v)$/i.test(f.name);
    if (isVideo !== videoPool) {
      rejected += 1;
      continue;
    }
    const id = `src_${++sourceIdCounter}`;
    state.sources.push({
      id,
      name: f.name,
      path: null,
      url: null,
      blobUrl: URL.createObjectURL(f),
      file: f,
      isVideo,
      avatarId: null,
      registered: false,
      neutralized: false,
      registrationState: 'idle',
      registrationProgress: 0,
    });
    if (!state.activeSourceId) setActiveSource(id);
  }
  renderSources();
  uploadSources();
  if (rejected) {
    statusText.textContent = videoPool
      ? 'Video dubbing avatar pool accepts video files only'
      : 'Audio/Conversation avatar pool accepts image files only';
  }
}

async function uploadSources() {
  for (const src of state.sources.filter(s => !s.path)) {
    const fd = new FormData();
    const cropSettings = currentAvatarCropSettings();
    fd.append('file', src.file);
    fd.append(
      'max_image_size',
      String(Math.max(
        64,
        Math.min(4096, Math.round(+$('maxImageSize').value || 1024)),
      )),
    );
    fd.append('face_idx', String(cropSettings.faceIdx));
    fd.append('crop_scale', String(cropSettings.cropScale));
    try {
      const r = await fetch('/api/upload/source', { method: 'POST', body: fd });
      const d = await r.json();
      src.path = d.path;
      src.url = d.url;
      if (src.blobUrl?.startsWith('blob:')) {
        URL.revokeObjectURL(src.blobUrl);
      }
      src.blobUrl = d.url;
      src.avatarId = d.avatar_id;
      src.isVideo = typeof d.is_video === 'boolean'
        ? d.is_video
        : isVideoSource(src);
      src.registered = !!d.registered && avatarMetadataMatchesCurrentCrop(d);
      src.neutralized = src.registered && !!d.neutralized;
      src.registrationState = src.registered ? 'registered' : 'idle';
      src.registrationProgress = src.registered ? 100 : 0;
      src.neutralizationState = src.neutralized ? 'neutralized' : 'idle';
      src.neutralizationProgress = src.neutralized ? 100 : 0;
      statusText.textContent = d.orientation_normalized
        ? `Uploaded: ${src.name} · fixed landscape rotation`
        : `Uploaded: ${src.name}`;
      renderSources();
      updateStartButton();
      saveState();
    } catch (e) { statusText.textContent = `Upload failed: ${src.name}`; }
  }
}

function removeSource(id) {
  const idx = state.sources.findIndex(s => s.id === id);
  if (idx === -1) return;
  const src = state.sources[idx];
  if (src.blobUrl) URL.revokeObjectURL(src.blobUrl);
  state.sources.splice(idx, 1);
  if (state.activeSourceId === id) {
    state.activeSourceId = visibleSources()[0]?.id || null;
  }
  renderSources(); updateBadges();}

function setActiveSource(id) {
  const src = state.sources.find(s => s.id === id);
  if (!src) return;
  const current = state.sources.find(s => s.id === state.activeSourceId);
  if (
    state.ws
    && state.ws.readyState === WebSocket.OPEN
    && current
    && current.isVideo !== src.isVideo
  ) {
    statusText.textContent = 'Stop before switching between image and video sources';
    return;
  }
  if (state.ws && state.ws.readyState === WebSocket.OPEN && !src.registered) {
    statusText.textContent = `Register ${src.name} before switching`;
    return;
  }
  if (
    state.ws
    && state.ws.readyState === WebSocket.OPEN
    && sourceNeedsNeutralization(src)
    && !src.neutralized
  ) {
    statusText.textContent = `Neutralize ${src.name} before switching`;
    return;
  }
  state.activeSourceId = id;
  state.activeSourceName = src.name;
  renderSources();
  updateBadges();
  if (state.ws && state.ws.readyState === WebSocket.OPEN) {
    if (src.avatarId) {
      state.ws.send(JSON.stringify({
        action: 'switch',
        source: src.avatarId,
        source_name: src.name,
        frame: currentPlaybackTimelineFrame(),
      }));
      statusText.textContent = `Switching → ${src.name}`;
    }
  }
  saveState();
}

async function registerAvatar(src) {
  if (!src.path || !src.avatarId) return;
  const cropSettings = currentAvatarCropSettings();
  src.registered = false;
  src.registrationState = 'queued';
  src.registrationProgress = 0;
  src.registrationMessage = 'Waiting for GPU';
  renderSources();
  updateStartButton();
  statusText.textContent = `Registering ${src.name} · waiting for GPU`;
  try {
    const response = await fetch('/api/avatar/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        avatar_id: src.avatarId,
        source_path: src.path,
        source_name: src.name,
        prepare_per_frame_normalize_delta: (
          state.mode === 'video'
          && $('stage0').checked
          && !$('neutral').checked
          && $('perFrameNormalizeDelta').checked
        ),
        face_idx: cropSettings.faceIdx,
        crop_scale: cropSettings.cropScale,
      }),
    });
    const job = await response.json();
    if (!response.ok) throw new Error(job.detail || 'Registration failed');
    if (!job.job_id) {
      finishAvatarRegistration(src, job);
      return;
    }
    await pollAvatarJob(src, job.job_id, 'registration');
  } catch (error) {
    src.registrationState = 'failed';
    src.registrationMessage = error.message;
    src.registered = false;
    renderSources();
    updateStartButton();
    statusText.textContent = `Registration failed: ${error.message}`;
  }
}

async function pollAvatarJob(src, jobId, kind) {
  while (true) {
    await new Promise(resolve => setTimeout(resolve, 500));
    const response = await fetch(`/api/avatar/register/${jobId}`);
    const job = await response.json();
    if (!response.ok) throw new Error(job.detail || 'Registration status failed');
    const neutralizing = kind === 'neutralization';
    src[neutralizing ? 'neutralizationState' : 'registrationState'] = job.status;
    src[neutralizing ? 'neutralizationProgress' : 'registrationProgress'] = job.progress || 0;
    renderSources();
    statusText.textContent = `${neutralizing ? 'Neutralizing' : 'Registering'} ${src.name} · ${job.message} · ${job.progress || 0}%`;
    if (job.status === 'completed') {
      if (neutralizing) finishAvatarNeutralization(src, job);
      else finishAvatarRegistration(src, job);
      return;
    }
    if (job.status === 'failed' || job.status === 'cancelled') {
      throw new Error(job.error || job.message || 'Registration failed');
    }
  }
}

function finishAvatarRegistration(src, job) {
  if (!avatarMetadataMatchesCurrentCrop(job.avatar)) {
    src.registered = false;
    src.neutralized = false;
    src.registrationState = 'idle';
    src.registrationProgress = 0;
    src.neutralizationState = 'idle';
    src.neutralizationProgress = 0;
    renderSources();
    updateStartButton();
    saveState();
    statusText.textContent = `${src.name} finished with old face/crop settings; register again`;
    return;
  }
  src.registered = true;
  src.neutralized = !!job.avatar?.neutralized;
  src.registrationState = 'registered';
  src.registrationProgress = 100;
  renderSources();
  updateStartButton();
  saveState();
  statusText.textContent = `${src.name} registered`;
}

async function neutralizeAvatar(src) {
  if (!src.registered || !src.avatarId) return;
  src.neutralized = false;
  src.neutralizationState = 'queued';
  src.neutralizationProgress = 0;
  renderSources();
  statusText.textContent = `Neutralizing ${src.name} · waiting for GPU`;
  try {
    const response = await fetch('/api/avatar/neutralize', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        avatar_id: src.avatarId,
      }),
    });
    const job = await response.json();
    if (!response.ok) throw new Error(job.detail || 'Neutralization failed');
    if (!job.job_id) finishAvatarNeutralization(src, job);
    else await pollAvatarJob(src, job.job_id, 'neutralization');
  } catch (error) {
    src.neutralizationState = 'failed';
    src.neutralized = false;
    renderSources();
    statusText.textContent = `Neutralization failed: ${error.message}`;
  }
}

function finishAvatarNeutralization(src, job) {
  if (!avatarMetadataMatchesCurrentCrop(job.avatar)) {
    src.registered = false;
    src.neutralized = false;
    src.registrationState = 'idle';
    src.registrationProgress = 0;
    src.neutralizationState = 'idle';
    src.neutralizationProgress = 0;
    renderSources();
    updateStartButton();
    saveState();
    statusText.textContent = `${src.name} finished with old face/crop settings; register again`;
    return;
  }
  src.neutralized = true;
  src.neutralizationState = 'neutralized';
  src.neutralizationProgress = 100;
  renderSources();
  updateStartButton();
  saveState();
  statusText.textContent = `${src.name} neutralized`;
}

function currentAvatarCropSettings() {
  const faceIdx = Math.max(0, Math.round(+$('faceIdx').value || 0));
  const rawCropScale = +$('cropScale').value;
  const cropScale = Number.isFinite(rawCropScale) && rawCropScale > 0
    ? rawCropScale
    : 2.3;
  $('faceIdx').value = String(faceIdx);
  $('cropScale').value = String(cropScale);
  return { faceIdx, cropScale };
}

function avatarMetadataMatchesCurrentCrop(metadata) {
  if (!metadata) return true;
  const current = currentAvatarCropSettings();
  return (
    +(metadata.face_idx ?? 0) === current.faceIdx
    && Math.abs(+(metadata.crop_scale ?? 2.3) - current.cropScale) < 1e-6
  );
}

function invalidateAvatarRegistrations(reason, includeVideo = false) {
  state.sources.forEach(src => {
    src.neutralized = false;
    const neutralizing = (
      src.neutralizationState === 'queued'
      || src.neutralizationState === 'running'
    );
    if (!neutralizing) {
      src.neutralizationState = 'idle';
      src.neutralizationProgress = 0;
    }
    if (includeVideo || !src.isVideo) {
      src.registered = false;
      const registering = (
        src.registrationState === 'queued'
        || src.registrationState === 'running'
      );
      if (!registering) {
        src.registrationState = 'idle';
        src.registrationProgress = 0;
      }
    }
  });
  if (reason) statusText.textContent = reason;
  renderSources();
  updateStartButton();
  saveState();
}

function uploadAudioFile(file) {
  if (!file.type.startsWith('audio/') && !file.name.match(/\.(wav|mp3|m4a|ogg|flac|aac)$/i)) {
    statusText.textContent = 'Not an audio file: ' + file.name; return;
  }
  const suffix = crypto.randomUUID
    ? crypto.randomUUID()
    : `${Date.now()}_${Math.random().toString(16).slice(2)}`;
  const id = `audio_${suffix}`;
  state.audioFiles.push({
    id,
    name: file.name,
    path: null,
    url: null,
    file,
    error: false,
  });
  state.activeAudioId = id;
  state.microphoneSelected = false;
  state.audioPath = null;
  state.audioUrl = null;
  if (!state.streaming) {
    audioPlayer.pause();
    audioPlayer.removeAttribute('src');
    audioPlayer.load();

  renderAudio();
  updateMotionControlState();
  const fd = new FormData(); fd.append('file', file);
  fetch('/api/upload/audio', { method: 'POST', body: fd }).then(r => r.json()).then(data => {
    const a = state.audioFiles.find(a => a.id === id);
    if (a) { a.path = data.path; a.url = data.url; }
    if (state.activeAudioId === id) {
      state.audioPath = data.path; state.audioUrl = data.url;
      if (!state.streaming) {
        audioPlayer.src = data.url;
        audioPlayer.hidden = false;
      }
    }
    renderAudio(); updateStartButton(); saveState();
  }).catch(() => {
    const audio = state.audioFiles.find(item => item.id === id);
    if (audio) audio.error = true;
    renderAudio();
    statusText.textContent = `Audio upload failed: ${file.name}`;
  });
}

let totalExpectedFrames = 0;
const MOTION_FPS = 25;
let streamTimelineFps = MOTION_FPS;
let playbackBufferFrames = 75;
let frameBuffer = new Map();
let receivedFrameCount = 0;
let streamRenderFps = MOTION_FPS;
let displayRaf = null;
let streamDone = false;
let audioStarted = false;
let showFrameIdx = -1;
let continuousIdle = false;
let streamHasAudio = false;
let streamUsesMicrophone = false;
let streamUsesConversationTts = false;
let idleClockStartedAt = null;
let idleClockStartFrame = 0;
const NETWORK_STALL_GRACE_MS = 120;
const NETWORK_REBUFFER_SECONDS = 12 / MOTION_FPS;
let networkRebuffering = false;
let missingVideoFrameSince = null;
let lastReportedPlayhead = -1;
let liveMicrophoneCapture = null;
let liveMicrophonePlayback = null;
const LIVE_MIC_SAMPLE_RATE = 16000;
const LIVE_MIC_PACKET_SAMPLES = 1600;
const LIVE_MIC_MAX_SOCKET_BYTES = 256 * 1024;
const LIVE_MIC_MAX_MONITOR_DELAY = 60;
let conversationTtsAudio = null;

async function prepareConversationTtsAudio() {
  stopConversationTtsAudio();
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if (!AudioContextClass) {
    throw new Error('This browser does not support streaming conversation audio');
  }
  const context = new AudioContextClass({ latencyHint: 'interactive' });
  const gain = context.createGain();
  gain.connect(context.destination);
  await context.resume();
  conversationTtsAudio = {
    context,
    gain,
    pending: [],
    started: false,
    startedAt: null,
    nextStartTime: null,
    scheduledEnd: null,
    suspendedForBuffering: false,
  };
}

function stopConversationTtsAudio() {
  const audio = conversationTtsAudio;
  conversationTtsAudio = null;
  if (!audio) return;
  try { audio.gain.disconnect(); } catch (error) {}
  audio.context.close().catch(() => {});
}

function scheduleConversationTtsBuffer(buffer) {
  const audio = conversationTtsAudio;
  if (!audio?.started) {
    audio?.pending.push(buffer);
    return;
  }
  const source = audio.context.createBufferSource();
  source.buffer = buffer;
  source.connect(audio.gain);
  const startAt = Math.max(
    audio.nextStartTime ?? (audio.context.currentTime + 0.05),
    audio.context.currentTime + 0.03,
  );
  source.start(startAt);
  if (audio.startedAt === null) audio.startedAt = startAt;
  audio.nextStartTime = startAt + buffer.duration;
  audio.scheduledEnd = audio.nextStartTime;
}

function enqueueConversationTtsPcm(pcmBytes) {
  const audio = conversationTtsAudio;
  if (!audio || pcmBytes.byteLength < 2) return;
  const sampleCount = Math.floor(pcmBytes.byteLength / 2);
  const view = new DataView(
    pcmBytes.buffer,
    pcmBytes.byteOffset,
    sampleCount * 2,
  );
  const buffer = audio.context.createBuffer(
    1,
    sampleCount,
    LIVE_MIC_SAMPLE_RATE,
  );
  const channel = buffer.getChannelData(0);
  for (let index = 0; index < sampleCount; index += 1) {
    channel[index] = view.getInt16(index * 2, true) / 32768;
  }
  scheduleConversationTtsBuffer(buffer);
}

function startConversationTtsPlayback() {
  const audio = conversationTtsAudio;
  if (!audio || audio.started) return;
  audio.started = true;
  const pending = audio.pending.splice(0);
  pending.forEach(scheduleConversationTtsBuffer);
}

function conversationTtsPlayheadSeconds() {
  const audio = conversationTtsAudio;
  if (!audio?.started || audio.startedAt === null) return 0;
  const elapsed = Math.max(0, audio.context.currentTime - audio.startedAt);
  if (audio.scheduledEnd === null) return elapsed;
  return Math.min(elapsed, audio.scheduledEnd - audio.startedAt);
}

function conversationTtsPlaybackEnded() {
  const audio = conversationTtsAudio;
  return !!(
    audio?.started
    && audio.scheduledEnd !== null
    && audio.context.currentTime >= audio.scheduledEnd - 0.01
  );
}

function pauseConversationTtsForBuffering() {
  const audio = conversationTtsAudio;
  if (!audio || audio.suspendedForBuffering) return;
  audio.suspendedForBuffering = true;
  audio.context.suspend().catch(() => {});
}

function resumeConversationTtsAfterBuffering() {
  const audio = conversationTtsAudio;
  if (!audio || !audio.suspendedForBuffering) return;
  audio.suspendedForBuffering = false;
  audio.context.resume().catch(() => {});
}

function pushLiveMicrophoneSamples(inputSamples) {
  const capture = liveMicrophoneCapture;
  if (!capture?.active || !inputSamples.length) return;

  const merged = new Float32Array(
    capture.resampleCarry.length + inputSamples.length,
  );
  merged.set(capture.resampleCarry);
  merged.set(inputSamples, capture.resampleCarry.length);

  const ratio = capture.audioContext.sampleRate / LIVE_MIC_SAMPLE_RATE;
  let position = capture.resamplePosition;
  const output = [];
  while (position + 1 < merged.length) {
    const index = Math.floor(position);
    const fraction = position - index;
    output.push(
      merged[index]
      + (merged[index + 1] - merged[index]) * fraction,
    );
    position += ratio;
  }

  const consumed = Math.min(
    Math.floor(position),
    Math.max(0, merged.length - 1),
  );
  capture.resampleCarry = merged.slice(consumed);
  capture.resamplePosition = position - consumed;
  if (!output.length) return;

  const combined = new Float32Array(
    capture.packetBuffer.length + output.length,
  );
  combined.set(capture.packetBuffer);
  combined.set(output, capture.packetBuffer.length);
  let offset = 0;
  while (combined.length - offset >= LIVE_MIC_PACKET_SAMPLES) {
    const packet = combined.slice(
      offset,
      offset + LIVE_MIC_PACKET_SAMPLES,
    );
    const socket = capture.socket;
    if (
      socket?.readyState === WebSocket.OPEN
      && socket.bufferedAmount <= LIVE_MIC_MAX_SOCKET_BYTES
    ) {
      socket.send(packet.buffer);
    }
    offset += LIVE_MIC_PACKET_SAMPLES;
  }
  capture.packetBuffer = combined.slice(offset);
}

async function prepareLiveMicrophone() {
  stopLiveMicrophone(false);
  if (!navigator.mediaDevices?.getUserMedia) {
    throw new Error('This browser does not support microphone capture');
  }
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if (!AudioContextClass) {
    throw new Error('This browser does not support Web Audio');
  }

  const mediaStream = await navigator.mediaDevices.getUserMedia({
    audio: {
      channelCount: 1,
      echoCancellation: true,
      noiseSuppression: true,
      autoGainControl: true,
    },
    video: false,
  });
  try {
    const audioContext = new AudioContextClass({ latencyHint: 'interactive' });
    await audioContext.resume();
    const source = audioContext.createMediaStreamSource(mediaStream);
    const processor = audioContext.createScriptProcessor(4096, 1, 1);
    const silentGain = audioContext.createGain();
    const monitorDelay = audioContext.createDelay(
      LIVE_MIC_MAX_MONITOR_DELAY,
    );
    const monitorGain = audioContext.createGain();
    silentGain.gain.value = 0;
    monitorDelay.delayTime.value = LIVE_MIC_MAX_MONITOR_DELAY;
    monitorGain.gain.value = $('microphonePlayback').checked ? 1 : 0;
    liveMicrophoneCapture = {
      mediaStream,
      audioContext,
      source,
      processor,
      silentGain,
      monitorDelay,
      monitorGain,
      socket: null,
      active: false,
      activatedAt: null,
      monitorConnected: false,
      monitorStarted: false,
      resampleCarry: new Float32Array(0),
      resamplePosition: 0,
      packetBuffer: new Float32Array(0),
    };
    processor.onaudioprocess = event => {
      event.outputBuffer.getChannelData(0).fill(0);
      pushLiveMicrophoneSamples(event.inputBuffer.getChannelData(0));
    };
    source.connect(processor);
    processor.connect(silentGain);
    silentGain.connect(audioContext.destination);
    monitorDelay.connect(monitorGain);
    monitorGain.connect(audioContext.destination);
  } catch (error) {
    mediaStream.getTracks().forEach(track => track.stop());
    throw error;
  }
}

function activateLiveMicrophone(socket) {
  if (!liveMicrophoneCapture) return;
  liveMicrophoneCapture.socket = socket;
  liveMicrophoneCapture.active = true;
  liveMicrophoneCapture.activatedAt = performance.now();
  if (!liveMicrophoneCapture.monitorConnected) {
    liveMicrophoneCapture.source.connect(
      liveMicrophoneCapture.monitorDelay,
    );
    liveMicrophoneCapture.monitorConnected = true;
  }
  state.microphoneStreaming = true;
  renderAudio();
}

function startLiveMicrophonePlayback() {
  const capture = liveMicrophoneCapture || liveMicrophonePlayback;
  if (
    !capture?.monitorConnected
    || capture.monitorStarted
    || capture.activatedAt === null
  ) {
    return;
  }
  const measuredDelay = (
    performance.now() - capture.activatedAt
  ) / 1000;
  const playbackDelay = Math.max(
    0.05,
    Math.min(LIVE_MIC_MAX_MONITOR_DELAY - 0.1, measuredDelay),
  );
  capture.monitorDelay.delayTime.cancelScheduledValues(
    capture.audioContext.currentTime,
  );
  capture.monitorDelay.delayTime.setValueAtTime(
    playbackDelay,
    capture.audioContext.currentTime,
  );
  capture.monitorStarted = true;
}

function updateLiveMicrophonePlaybackGain() {
  const enabled = $('microphonePlayback').checked;
  [liveMicrophoneCapture, liveMicrophonePlayback].forEach(capture => {
    if (!capture) return;
    capture.monitorGain.gain.setTargetAtTime(
      enabled ? 1 : 0,
      capture.audioContext.currentTime,
      0.01,
    );
  });
}

function closeLiveMicrophoneGraph(capture) {
  if (!capture) return;
  capture.processor.onaudioprocess = null;
  try { capture.source.disconnect(); } catch (error) {}
  try { capture.processor.disconnect(); } catch (error) {}
  try { capture.silentGain.disconnect(); } catch (error) {}
  try { capture.monitorDelay.disconnect(); } catch (error) {}
  try { capture.monitorGain.disconnect(); } catch (error) {}
  capture.mediaStream.getTracks().forEach(track => track.stop());
  capture.audioContext.close().catch(() => {});
}

function stopLiveMicrophone(sendFinal) {
  const capture = liveMicrophoneCapture;
  liveMicrophoneCapture = null;
  state.microphoneStreaming = false;
  if (capture) {
    capture.active = false;
    if (sendFinal && capture.socket?.readyState === WebSocket.OPEN) {
      if (capture.packetBuffer.length) {
        capture.socket.send(capture.packetBuffer.slice().buffer);
      }
      capture.socket.send(JSON.stringify({ action: 'mic_stop' }));
    }
    capture.processor.onaudioprocess = null;
    try { capture.source.disconnect(capture.processor); } catch (error) {}
    try { capture.processor.disconnect(); } catch (error) {}
    try { capture.silentGain.disconnect(); } catch (error) {}
    capture.mediaStream.getTracks().forEach(track => track.stop());
    if (sendFinal && capture.monitorConnected) {
      closeLiveMicrophoneGraph(liveMicrophonePlayback);
      liveMicrophonePlayback = capture;
    } else {
      closeLiveMicrophoneGraph(capture);
    }
  }
  if (!sendFinal && liveMicrophonePlayback) {
    closeLiveMicrophoneGraph(liveMicrophonePlayback);
    liveMicrophonePlayback = null;
  }
  if (capture) renderAudio();
}

function rebufferTargetFrames(targetFrame) {
  const targetBufferFrames = Math.max(
    1,
    Math.round(NETWORK_REBUFFER_SECONDS * streamTimelineFps),
  );
  if (totalExpectedFrames <= 0) return targetBufferFrames;
  return Math.max(
    1,
    Math.min(targetBufferFrames, totalExpectedFrames - targetFrame),
  );
}

function bufferedFrameAtOrBefore(targetFrame) {
  let candidate = Math.min(targetFrame, state.frameCount - 1);
  const lookbackFrames = Math.max(
    1,
    Math.round(0.16 * streamTimelineFps),
  );
  const oldestUseful = Math.max(
    showFrameIdx + 1,
    candidate - lookbackFrames,
  );
  while (candidate >= oldestUseful) {
    if (frameBuffer.has(candidate)) return candidate;
    candidate -= 1;
  }
  return null;
}

function showBufferedFrame(frameIndex) {
  const blob = frameBuffer.get(frameIndex);
  if (!blob) return false;
  if (frameIndex === showFrameIdx) return true;
  showFrameIdx = frameIndex;
  const url = URL.createObjectURL(blob);
  const old = frameImg.src;
  frameImg.src = url;
  if (old?.startsWith('blob:')) URL.revokeObjectURL(old);
  return true;
}

function currentPlaybackTimelineFrame() {
  if (streamUsesConversationTts) {
    return Math.max(
      0,
      Math.floor(conversationTtsPlayheadSeconds() * streamTimelineFps),
    );
  }
  if (audioStarted && streamHasAudio && !audioPlayer.ended) {
    return Math.max(
      0,
      Math.floor(audioPlayer.currentTime * streamTimelineFps),
    );
  }
  return Math.max(0, showFrameIdx);
}

function reportPlayhead(frameIndex, force = false) {
  const normalizedFrame = Math.max(0, Math.floor(frameIndex));
  if (!force && normalizedFrame <= lastReportedPlayhead) return;
  if (!state.ws || state.ws.readyState !== WebSocket.OPEN) return;
  lastReportedPlayhead = normalizedFrame;
  state.ws.send(JSON.stringify({
    action: 'playhead',
    frame: normalizedFrame,
  }));
}

function conversationStreamIsReusable() {
  return state.mode === 'conversation' && currentStreamCanBeReplaced();
}

function audioStreamIsReusable() {
  return (
    (state.mode === 'audio' || state.mode === 'video')
    && currentStreamCanBeReplaced()
  );
}

function currentStreamCanBeReplaced() {
  const socketActive = state.ws && (
    state.ws.readyState === WebSocket.CONNECTING
    || state.ws.readyState === WebSocket.OPEN
  );
  return (
    state.streaming
    && (streamDone || (continuousIdle && socketActive))
  );
}

function updateStartButton() {
